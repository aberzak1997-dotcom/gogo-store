<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0E121A"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow1" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#1160CB" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0E121A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1528A1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0E121A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1160CB"/>
      <stop offset="100%" stop-color="#479BF7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Decorative circles (right side) -->
  <circle cx="980" cy="200" r="260" fill="none" stroke="rgba(17,96,203,0.12)" stroke-width="1.5"/>
  <circle cx="980" cy="200" r="190" fill="none" stroke="rgba(17,96,203,0.10)" stroke-width="1"/>
  <circle cx="980" cy="200" r="120" fill="none" stroke="rgba(71,155,247,0.12)" stroke-width="1"/>
  <circle cx="980" cy="200" r="55"  fill="rgba(17,96,203,0.10)"/>

  <!-- Small accent dots -->
  <circle cx="140" cy="540" r="4" fill="#1160CB" opacity="0.5"/>
  <circle cx="165" cy="540" r="4" fill="#479BF7" opacity="0.35"/>
  <circle cx="190" cy="540" r="4" fill="#1528A1" opacity="0.25"/>

  <!-- Top accent line -->
  <rect x="80" y="72" width="120" height="3" rx="2" fill="url(#accentLine)"/>

  <!-- WIVITEC wordmark -->
  <text x="80" y="250" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#FFFFFF">WIVI</text>
  <text x="356" y="250" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-2" fill="#479BF7">TEC</text>

  <!-- Tagline -->
  <text x="82" y="308" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="6" fill="rgba(255,255,255,0.40)" text-transform="uppercase">TECHNOLOGY. ELEVATED.</text>

  <!-- Divider -->
  <rect x="80" y="348" width="520" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Description -->
  <text x="80" y="392" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.45)" font-weight="400">Morocco's premier destination for premium electronics</text>
  <text x="80" y="422" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.45)" font-weight="400">and accessories. Fast delivery · 1-Year Warranty.</text>

  <!-- CTA pill -->
  <rect x="80" y="468" width="218" height="46" rx="23" fill="#1160CB"/>
  <text x="189" y="498" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Shop at WIVITEC</text>

  <!-- URL label -->
  <text x="80" y="576" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.20)" font-weight="500" letter-spacing="1">wivitec.com</text>

  <!-- Right-side icon cluster (abstract tech shapes) -->
  <rect x="860" y="360" width="56" height="56" rx="12" fill="rgba(17,96,203,0.15)" stroke="rgba(17,96,203,0.3)" stroke-width="1"/>
  <rect x="930" y="360" width="56" height="56" rx="12" fill="rgba(71,155,247,0.10)" stroke="rgba(71,155,247,0.25)" stroke-width="1"/>
  <rect x="860" y="430" width="56" height="56" rx="12" fill="rgba(21,40,161,0.12)" stroke="rgba(21,40,161,0.25)" stroke-width="1"/>
  <rect x="930" y="430" width="56" height="56" rx="12" fill="rgba(17,96,203,0.08)" stroke="rgba(17,96,203,0.2)" stroke-width="1"/>

  <!-- Icon lines inside boxes (simplified) -->
  <line x1="876" y1="388" x2="900" y2="388" stroke="#479BF7" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="876" y1="396" x2="892" y2="396" stroke="#479BF7" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="946" y1="388" x2="970" y2="388" stroke="#1160CB" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="946" y1="396" x2="962" y2="396" stroke="#1160CB" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
